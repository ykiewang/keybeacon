name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify site payload
        run: |
          test -f site/index.html
          echo "--- site tree ---"
          find site -type f | sort
          echo "--- referenced assets ---"
          grep -oE 'src="assets/[^"]+"' site/index.html | sed 's/src="//;s/"//' | sort -u | while read -r f; do
            test -f "site/$f" || { echo "MISSING: site/$f"; exit 1; }
          done
          echo "site payload OK"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
